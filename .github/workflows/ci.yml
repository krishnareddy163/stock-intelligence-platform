name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: "17"
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ──────────────────────────────────────────────
  # Java services (matrix build)
  # ──────────────────────────────────────────────
  java-tests:
    name: Java — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - portfolio-service
          - recommendation-service
          - api-gateway

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for SonarCloud blame data

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build & test ${{ matrix.service }}
        working-directory: backend/${{ matrix.service }}
        run: mvn -B verify --no-transfer-progress

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.service }}
          path: backend/${{ matrix.service }}/target/site/jacoco/
          retention-days: 7

  # ──────────────────────────────────────────────
  # Python — AI Orchestrator
  # ──────────────────────────────────────────────
  python-orchestrator:
    name: Python — AI Orchestrator
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ai-orchestrator/requirements.txt

      - name: Install dependencies
        working-directory: ai-orchestrator
        run: pip install -r requirements.txt pytest pytest-asyncio pytest-cov respx

      - name: Run tests with coverage
        working-directory: ai-orchestrator
        run: |
          pytest tests/ -v \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-omit="tests/*"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ai-orchestrator
          path: ai-orchestrator/coverage.xml
          retention-days: 7

  # ──────────────────────────────────────────────
  # Python — MCP Servers
  # ──────────────────────────────────────────────
  python-mcp-servers:
    name: Python — MCP ${{ matrix.server }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server:
          - stock-data-server
          - technical-analysis-server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: mcp-servers/${{ matrix.server }}/requirements.txt

      - name: Install dependencies
        working-directory: mcp-servers/${{ matrix.server }}
        run: pip install -r requirements.txt pytest pytest-asyncio pytest-cov respx

      - name: Run tests with coverage
        working-directory: mcp-servers/${{ matrix.server }}
        run: |
          pytest tests/ -v \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-omit="tests/*"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.server }}
          path: mcp-servers/${{ matrix.server }}/coverage.xml
          retention-days: 7

  # ──────────────────────────────────────────────
  # Frontend — build & type-check
  # ──────────────────────────────────────────────
  frontend-build:
    name: Frontend — build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  # ──────────────────────────────────────────────
  # Frontend — Jest unit tests
  # ──────────────────────────────────────────────
  frontend-unit-tests:
    name: Frontend — Jest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Jest tests with coverage
        working-directory: frontend
        run: npm run test:coverage -- --ci

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend-jest
          path: frontend/coverage/
          retention-days: 7

  # ──────────────────────────────────────────────
  # Frontend — Playwright E2E
  # ──────────────────────────────────────────────
  frontend-e2e:
    name: Frontend — Playwright E2E
    runs-on: ubuntu-latest
    needs: frontend-build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build for E2E
        working-directory: frontend
        run: npm run build

      - name: Run Playwright tests
        working-directory: frontend
        run: PLAYWRIGHT_BASE_URL=http://localhost:3000 npx next start &
             sleep 5 && npm run test:e2e -- --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ──────────────────────────────────────────────
  # Python integration tests
  # ──────────────────────────────────────────────
  python-integration:
    name: Python — Integration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r ai-orchestrator/requirements.txt \
                      -r mcp-servers/stock-data-server/requirements.txt \
                      -r mcp-servers/technical-analysis-server/requirements.txt \
                      -r integration-tests/python/requirements.txt -q

      - name: Run integration tests
        working-directory: integration-tests/python
        run: pytest . -v --cov --cov-report=xml:coverage.xml -q

  # ──────────────────────────────────────────────
  # X-Ray acceptance tests
  # ──────────────────────────────────────────────
  xray-tests:
    name: X-Ray Acceptance Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r ai-orchestrator/requirements.txt \
                      -r mcp-servers/stock-data-server/requirements.txt \
                      -r mcp-servers/technical-analysis-server/requirements.txt \
                      -r xray-tests/requirements.txt -q

      - name: Run X-Ray acceptance tests
        working-directory: xray-tests
        run: pytest . -v -q

  # ──────────────────────────────────────────────
  # Performance benchmarks
  # ──────────────────────────────────────────────
  performance-benchmarks:
    name: Performance — Benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r mcp-servers/technical-analysis-server/requirements.txt \
                      -r ai-orchestrator/requirements.txt \
                      -r performance-tests/benchmark/requirements.txt -q

      - name: Run benchmarks
        working-directory: performance-tests/benchmark
        run: |
          pytest test_benchmarks.py \
            --benchmark-json=benchmark-results.json \
            --benchmark-sort=mean \
            -v

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: performance-tests/benchmark/benchmark-results.json
          retention-days: 30

  # ──────────────────────────────────────────────
  # SonarQube analysis — self-hosted community
  # ──────────────────────────────────────────────
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs:
      - java-tests
      - python-orchestrator
      - python-mcp-servers
      - python-integration
      - xray-tests
      - frontend-build
      - frontend-unit-tests

    services:
      sonarqube:
        image: sonarqube:community
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 120s

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Compile Java services
        run: |
          for svc in user-service portfolio-service recommendation-service api-gateway; do
            cd backend/$svc && mvn -B verify --no-transfer-progress -q && cd ../..
          done

      - name: Run Python coverage (orchestrator)
        working-directory: ai-orchestrator
        run: |
          pip install -r requirements.txt pytest pytest-asyncio pytest-cov respx -q
          pytest tests/ --cov=. --cov-report=xml:coverage.xml --cov-omit="tests/*" -q

      - name: Run Python coverage (stock-data-server)
        working-directory: mcp-servers/stock-data-server
        run: |
          pip install -r requirements.txt pytest pytest-asyncio pytest-cov respx -q
          pytest tests/ --cov=. --cov-report=xml:coverage.xml --cov-omit="tests/*" -q

      - name: Run Python coverage (technical-analysis-server)
        working-directory: mcp-servers/technical-analysis-server
        run: |
          pip install -r requirements.txt pytest pytest-asyncio pytest-cov respx -q
          pytest tests/ --cov=. --cov-report=xml:coverage.xml --cov-omit="tests/*" -q

      - name: Install sonar-scanner
        run: |
          curl -sSLo sonar-scanner.zip \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip -q sonar-scanner.zip
          echo "$(pwd)/sonar-scanner-5.0.1.3006-linux/bin" >> $GITHUB_PATH

      - name: Run SonarQube scan
        run: |
          sonar-scanner \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.token=admin \
            -Dsonar.projectKey=stock-intelligence-platform \
            -Dsonar.projectName="Stock Intelligence Platform"
