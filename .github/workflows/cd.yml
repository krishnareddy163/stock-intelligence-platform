name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated services to deploy (leave empty for all)"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/stockiq

jobs:
  # ──────────────────────────────────────────────
  # Determine which services changed
  # ──────────────────────────────────────────────
  changed-services:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: set-matrix
        run: |
          MANUAL="${{ github.event.inputs.services }}"
          if [ -n "$MANUAL" ]; then
            # Manual trigger with specific services
            SERVICES=$(echo "$MANUAL" | tr ',' '\n' | jq -R . | jq -sc .)
          else
            # Auto-detect changed paths
            SERVICES="[]"
            declare -A PATHS=(
              ["ai-orchestrator"]="ai-orchestrator/"
              ["stock-data-server"]="mcp-servers/stock-data-server/"
              ["technical-analysis-server"]="mcp-servers/technical-analysis-server/"
              ["user-service"]="backend/user-service/"
              ["portfolio-service"]="backend/portfolio-service/"
              ["recommendation-service"]="backend/recommendation-service/"
              ["api-gateway"]="backend/api-gateway/"
              ["frontend"]="frontend/"
            )
            for svc in "${!PATHS[@]}"; do
              if git diff --name-only HEAD~1 HEAD | grep -q "^${PATHS[$svc]}"; then
                SERVICES=$(echo "$SERVICES" | jq --arg s "$svc" '. + [$s]')
              fi
            done
            # Always include if empty (first push / force)
            if [ "$SERVICES" = "[]" ]; then
              SERVICES='["ai-orchestrator","stock-data-server","technical-analysis-server","user-service","portfolio-service","recommendation-service","api-gateway","frontend"]'
            fi
          fi
          echo "matrix={\"service\":$SERVICES}" >> "$GITHUB_OUTPUT"
          echo "Building: $SERVICES"

  # ──────────────────────────────────────────────
  # Build & push Docker images
  # ──────────────────────────────────────────────
  build-and-push:
    name: Docker — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: changed-services
    if: ${{ needs.changed-services.outputs.matrix != '{"service":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changed-services.outputs.matrix) }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve Dockerfile path
        id: context
        run: |
          case "${{ matrix.service }}" in
            ai-orchestrator)
              echo "context=ai-orchestrator" >> "$GITHUB_OUTPUT"
              echo "dockerfile=ai-orchestrator/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;
            stock-data-server)
              echo "context=mcp-servers/stock-data-server" >> "$GITHUB_OUTPUT"
              echo "dockerfile=mcp-servers/stock-data-server/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;
            technical-analysis-server)
              echo "context=mcp-servers/technical-analysis-server" >> "$GITHUB_OUTPUT"
              echo "dockerfile=mcp-servers/technical-analysis-server/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;
            user-service|portfolio-service|recommendation-service|api-gateway)
              echo "context=backend/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
              echo "dockerfile=backend/${{ matrix.service }}/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;
            frontend)
              echo "context=frontend" >> "$GITHUB_OUTPUT"
              echo "dockerfile=frontend/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.context.outputs.context }}
          file: ${{ steps.context.outputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # Summary notification
  # ──────────────────────────────────────────────
  notify:
    name: Deployment summary
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always()

    steps:
      - name: Report status
        run: |
          if [ "${{ needs.build-and-push.result }}" = "success" ]; then
            echo "All images built and pushed successfully."
          else
            echo "One or more image builds failed — check the build-and-push jobs above."
            exit 1
          fi
