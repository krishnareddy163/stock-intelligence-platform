spring:
  application:
    name: user-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/stock_db}
    username: ${DATABASE_USER:stock_user}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: 8081
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET:YourVerySecureJWTSecretKeyHereWithMinimum32CharactersLength}
  expiration: ${JWT_EXPIRY_HOURS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: INFO
    com.stock.user: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
