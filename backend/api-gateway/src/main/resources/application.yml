server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: userCircuit
                fallbackUri: forward:/fallback/user

        - id: recommendation-service
          uri: http://recommendation-service:8082
          predicates:
            - Path=/api/v1/recommendations/**
          filters:
            - name: CircuitBreaker
              args:
                name: recommendationCircuit
                fallbackUri: forward:/fallback/recommendation

        - id: portfolio-service
          uri: http://portfolio-service:8083
          predicates:
            - Path=/api/v1/portfolios/**
          filters:
            - name: CircuitBreaker
              args:
                name: portfolioCircuit
                fallbackUri: forward:/fallback/portfolio

        - id: ai-orchestrator
          uri: http://ai-orchestrator:5000
          predicates:
            - Path=/api/v1/ai/**
          filters:
            - RewritePath=/api/v1/ai/(?<segment>.*), /${segment}

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
            allowedHeaders: "*"

      default-filters:
        - AddResponseHeader=X-Gateway-Version, 1.0.0

  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:change-me-in-production-32-chars-min}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.stock.gateway: DEBUG
