apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-orchestrator
  namespace: stock-intelligence
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-orchestrator
  template:
    metadata:
      labels:
        app: ai-orchestrator
    spec:
      containers:
        - name: ai-orchestrator
          image: stock-intelligence/ai-orchestrator:latest
          ports:
            - containerPort: 5000
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: anthropic-api-key
            - name: MCP_STOCK_DATA_URL
              value: "http://stock-data-server:5001"
            - name: MCP_SENTIMENT_URL
              value: "http://sentiment-server:5002"
            - name: MCP_PREDICTION_URL
              value: "http://prediction-server:5003"
            - name: MCP_PORTFOLIO_URL
              value: "http://portfolio-server:5004"
            - name: MCP_TECHNICAL_URL
              value: "http://technical-analysis-server:5005"
            - name: MCP_ALERT_URL
              value: "http://alert-server:5006"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-orchestrator
  namespace: stock-intelligence
spec:
  selector:
    app: ai-orchestrator
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-orchestrator-hpa
  namespace: stock-intelligence
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-orchestrator
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
