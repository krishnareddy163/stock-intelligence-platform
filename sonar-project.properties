sonar.projectKey=stock-intelligence-platform
sonar.projectName=Stock Intelligence Platform
sonar.projectVersion=1.0.0

# Source encoding
sonar.sourceEncoding=UTF-8

# Multi-module setup — each module declares its own sources
sonar.modules=ai-orchestrator,stock-data-server,technical-analysis-server,user-service,portfolio-service,recommendation-service,api-gateway

# ── AI Orchestrator (Python) ──────────────────────────────────────
ai-orchestrator.sonar.projectName=AI Orchestrator
ai-orchestrator.sonar.projectBaseDir=ai-orchestrator
ai-orchestrator.sonar.sources=.
ai-orchestrator.sonar.tests=tests
ai-orchestrator.sonar.exclusions=tests/**,**/__pycache__/**,*.pyc
ai-orchestrator.sonar.python.coverage.reportPaths=coverage.xml
ai-orchestrator.sonar.python.version=3.11

# ── Stock Data MCP Server (Python) ───────────────────────────────
stock-data-server.sonar.projectName=Stock Data MCP Server
stock-data-server.sonar.projectBaseDir=mcp-servers/stock-data-server
stock-data-server.sonar.sources=.
stock-data-server.sonar.tests=tests
stock-data-server.sonar.exclusions=tests/**,**/__pycache__/**,*.pyc
stock-data-server.sonar.python.coverage.reportPaths=coverage.xml
stock-data-server.sonar.python.version=3.11

# ── Technical Analysis MCP Server (Python) ───────────────────────
technical-analysis-server.sonar.projectName=Technical Analysis MCP Server
technical-analysis-server.sonar.projectBaseDir=mcp-servers/technical-analysis-server
technical-analysis-server.sonar.sources=.
technical-analysis-server.sonar.tests=tests
technical-analysis-server.sonar.exclusions=tests/**,**/__pycache__/**,*.pyc
technical-analysis-server.sonar.python.coverage.reportPaths=coverage.xml
technical-analysis-server.sonar.python.version=3.11

# ── User Service (Java / Spring Boot) ────────────────────────────
user-service.sonar.projectName=User Service
user-service.sonar.projectBaseDir=backend/user-service
user-service.sonar.sources=src/main/java
user-service.sonar.tests=src/test/java
user-service.sonar.java.binaries=target/classes
user-service.sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# ── Portfolio Service (Java / Spring Boot) ────────────────────────
portfolio-service.sonar.projectName=Portfolio Service
portfolio-service.sonar.projectBaseDir=backend/portfolio-service
portfolio-service.sonar.sources=src/main/java
portfolio-service.sonar.tests=src/test/java
portfolio-service.sonar.java.binaries=target/classes
portfolio-service.sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# ── Recommendation Service (Java / Spring Boot) ───────────────────
recommendation-service.sonar.projectName=Recommendation Service
recommendation-service.sonar.projectBaseDir=backend/recommendation-service
recommendation-service.sonar.sources=src/main/java
recommendation-service.sonar.tests=src/test/java
recommendation-service.sonar.java.binaries=target/classes
recommendation-service.sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# ── API Gateway (Java / Spring Cloud Gateway) ─────────────────────
api-gateway.sonar.projectName=API Gateway
api-gateway.sonar.projectBaseDir=backend/api-gateway
api-gateway.sonar.sources=src/main/java
api-gateway.sonar.tests=src/test/java
api-gateway.sonar.java.binaries=target/classes
api-gateway.sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
